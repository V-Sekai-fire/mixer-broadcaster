name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # setup-beam rather than pixi: conda-forge has no Erlang for win-64 and the matrix must include Windows
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: mix local.hex --force && mix local.rebar --force
      - name: Fetch dependencies (re-resolve when this runner's Hex edge lacks locked releases)
        shell: bash
        run: |
          mix deps.get || {
            echo "the lock names releases this runner's Hex index does not have yet; resolving from scratch"
            rm -f mix.lock
            mix deps.get
          }
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - run: mix test
      # Dialyzer on one OS is enough: the analysis is the same everywhere. The PLTs are cached.
      - name: Cache the Dialyzer PLTs
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: _build/dev/*.plt
          key: plt-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - name: Dialyzer
        if: runner.os == 'Linux'
        run: mix dialyzer
