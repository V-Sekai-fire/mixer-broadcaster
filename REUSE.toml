precedence = "closest"
SPDX-FileCopyrightText = "2026 K. S. Ernest (iFire) Lee"
SPDX-License-Identifier = "MIT"

# The pixi lock file is generated from clients/python/pixi.toml.
[[annotations]]
path = ["clients/python/pixi.lock", "clients/python/pixi.toml"]
precedence = "closest"
SPDX-FileCopyrightText = "2026-present K. S. Ernest (iFire) Lee"
SPDX-License-Identifier = "MIT"
