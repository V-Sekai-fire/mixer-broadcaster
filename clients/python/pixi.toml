[workspace]
name = "mixer-python-client"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
pytest = "*"
hypothesis = "*"
aioquic = "*"
numpy = "*"

# Mitsuba 3 is not on conda-forge; pixi installs it from PyPI.
[pypi-dependencies]
mitsuba = "*"

[tasks]
test = "python -m pytest tests/hypo -q"
